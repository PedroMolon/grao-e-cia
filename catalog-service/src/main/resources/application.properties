server.port=8082

spring.application.name=catalog-service
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/catalog_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

rsa.public-key=classpath:certs/app.pub

langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=qwen2.5-coder:1.5b
langchain4j.ollama.chat-model.temperature=0.7
langchain4j.ollama.chat-model.timeout=60s